<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!-- A failed job, explained: where it stopped, what happened, what to do, and whether the data was touched -->
<section class="failure" th:fragment="card(f, id)" th:id="${id}">
    <h2 th:text="${f.title()}"></h2>
    <dl>
        <dt>Stopped at</dt>
        <dd><b th:text="${f.stage()}"></b> · <span th:text="${f.step()}"></span></dd>
        <dt>What happened</dt>
        <dd th:text="${f.what()}"></dd>
        <dt>Likely cause</dt>
        <dd th:text="${f.cause()}"></dd>
        <dt>What to do</dt>
        <dd th:text="${f.todo()}"></dd>
        <dt>Your data</dt>
        <dd th:classappend="${f.safe() ? 'safe' : 'check'}" th:text="${f.data()}"></dd>
    </dl>
    <details>
        <summary>Technical details</summary>
        <pre th:id="${id + '-text'}" th:text="${f.technical()}"></pre>
        <button type="button" class="secondary" th:data-copy="${'#' + id + '-text'}">Copy details</button>
    </details>
</section>
</body>
</html>
